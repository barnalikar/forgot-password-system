<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body{
            font-family: Arial;
            background: #f2f2f2;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:white;
            padding:30px;
            border-radius:10px;
            width:300px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.2);
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
        }

        button{
            width:100%;
            padding:10px;
            margin-top:15px;
            background:black;
            color:white;
            border:none;
            cursor:pointer;
        }

        a{
            display:block;
            margin-top:10px;
            text-align:center;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Login</h2>

    <input type="email" id="email" placeholder="Enter Email">
    <input type="password" id="password" placeholder="Enter Password">

    <button onclick="login()">Login</button>

    <a href="/forgot-page">Forgot Password?</a>
</div>

<script>
async function login(){

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const response = await fetch('/login',{
        method:'POST',
        headers:{
            'Content-Type':'application/json'
        },
        body: JSON.stringify({
            email:email,
            password:password
        })
    });

    const data = await response.json();

    alert(data.message);
}
</script>

</body>
</html>

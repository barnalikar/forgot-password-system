<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>

    <style>
        body{
            font-family: Arial;
            background:#f2f2f2;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:white;
            padding:30px;
            border-radius:10px;
            width:300px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.2);
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
        }

        button{
            width:100%;
            padding:10px;
            margin-top:15px;
            background:black;
            color:white;
            border:none;
            cursor:pointer;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Forgot Password</h2>

    <input type="email" id="email" placeholder="Enter Email">

    <button onclick="resetPassword()">Reset Password</button>
</div>

<script>
async function resetPassword(){

    const email = document.getElementById("email").value;

    const response = await fetch('/forgot-password',{
        method:'POST',
        headers:{
            'Content-Type':'application/json'
        },
        body: JSON.stringify({
            email:email
        })
    });

    const data = await response.json();

    if(data.new_password){
        alert(data.message + "\nNew Password: " + data.new_password);
    }
    else{
        alert(data.message);
    }
}
</script>

</body>
</html>
